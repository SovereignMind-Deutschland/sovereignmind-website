<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="t d">
  <title id="t">Architektur von SovereignMind</title>
  <desc id="d">Die Web-Oberfläche greift auf das Backend zu. Das Backend nutzt Inferenz, Vektordatenbank, Dokumentenverarbeitung, Sprache und PostgreSQL.</desc>
  <style>
    .box { fill: #0b1430; stroke: #38bdf8; stroke-width: 1.5; }
    .main { fill: #0089cf; }
    .t { font: 600 15px system-ui, sans-serif; fill: #f1f6ff; text-anchor: middle; }
    .w { font: 600 15px system-ui, sans-serif; fill: #fff; text-anchor: middle; }
    .s { font: 12px system-ui, sans-serif; fill: #9db0d3; text-anchor: middle; }
    .l { stroke: #38bdf8; stroke-width: 1.5; fill: none; }
    .out { fill: none; stroke: #0089cf; stroke-width: 1.5; stroke-dasharray: 6 4; }
  </style>
  <rect class="out" x="8" y="8" width="744" height="344" rx="12"/>
  <text class="s" x="380" y="30">Alles läuft beim Kunden – keine Cloud-KI-Anbindung</text>

  <rect class="box" x="30" y="150" width="150" height="60" rx="8"/>
  <text class="t" x="105" y="177">Web-Oberfläche</text>
  <text class="s" x="105" y="195">Browser</text>

  <rect class="main" x="250" y="140" width="190" height="80" rx="8"/>
  <text class="w" x="345" y="173">Backend</text>
  <text class="s" x="345" y="196" style="fill:#e0f2fe">Auth, Rollen, Lizenz, Mandanten</text>

  <path class="l" d="M180 180H250"/>
  <path class="l" d="M440 180H490M490 60V300M490 60H520M490 120H520M490 180H520M490 240H520M490 300H520"/>

  <rect class="box" x="520" y="38" width="210" height="44" rx="8"/>
  <text class="t" x="625" y="65">Inferenz (Ollama)</text>
  <rect class="box" x="520" y="98" width="210" height="44" rx="8"/>
  <text class="t" x="625" y="125">Vektordatenbank (Qdrant)</text>
  <rect class="box" x="520" y="158" width="210" height="44" rx="8"/>
  <text class="t" x="625" y="185">Dokumente (Docling)</text>
  <rect class="box" x="520" y="218" width="210" height="44" rx="8"/>
  <text class="t" x="625" y="245">Sprache (Voice-Worker)</text>
  <rect class="box" x="520" y="278" width="210" height="44" rx="8"/>
  <text class="t" x="625" y="305">PostgreSQL</text>
</svg>
