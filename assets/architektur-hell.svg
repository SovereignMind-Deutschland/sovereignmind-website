<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="t d">
  <title id="t">Architektur von SovereignMind</title>
  <desc id="d">Die Web-Oberfläche greift auf das Backend zu. Das Backend nutzt Inferenz, Vektordatenbank, Dokumentenverarbeitung, Sprache und PostgreSQL.</desc>
  <style>
    :root { --box: #ffffff; --line: #00669c; --text: #0a2540; --muted: #44566b; --main: #00669c; --on-main: #ffffff; --house: #b8862f; --house-text: #7f5a12; }
    text { font-family: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; }
    .box { fill: var(--box); stroke: var(--line); stroke-width: 1.5; }
    .main { fill: var(--main); }
    .t { font-size: 16px; font-weight: 600; fill: var(--text); }
    .w { font-size: 16px; font-weight: 600; fill: var(--on-main); }
    .s { font-size: 14px; fill: var(--muted); }
    .ws { font-size: 14px; fill: var(--on-main); }
    .h { font-size: 14px; font-weight: 600; fill: var(--house-text); }
    .l { stroke: var(--line); stroke-width: 1.5; fill: none; }
    .out { fill: none; stroke: var(--house); stroke-width: 2; stroke-dasharray: 8 5; }
  </style>
  <rect class="out" x="8" y="8" width="744" height="344" rx="6"/>
  <text class="h" x="380" y="32">Alles läuft in Ihrem Netz, ohne Cloud-KI-Anbindung</text>
  <rect class="box" x="30" y="150" width="150" height="60" rx="8"/>
  <text class="t" x="105" y="177">Web-Oberfläche</text>
  <text class="s" x="105" y="197">Browser</text>
  <rect class="main" x="245" y="135" width="180" height="90" rx="8"/>
  <text class="w" x="335" y="168">Backend</text>
  <text class="ws" x="335" y="190">Auth, Rollen,</text>
  <text class="ws" x="335" y="208">Lizenz, Mandanten</text>
  <path class="l" d="M180 180H245"/>
  <path class="l" d="M425 180H470M470 66V306M470 66H500M470 126H500M470 186H500M470 246H500M470 306H500"/>
  <rect class="box" x="500" y="44" width="230" height="44" rx="8"/>
  <text class="t" x="615" y="71">Inferenz (Ollama)</text>
  <rect class="box" x="500" y="104" width="230" height="44" rx="8"/>
  <text class="t" x="615" y="131">Vektordatenbank (Qdrant)</text>
  <rect class="box" x="500" y="164" width="230" height="44" rx="8"/>
  <text class="t" x="615" y="191">Dokumente (Docling)</text>
  <rect class="box" x="500" y="224" width="230" height="44" rx="8"/>
  <text class="t" x="615" y="251">Sprache (Voice-Worker)</text>
  <rect class="box" x="500" y="284" width="230" height="44" rx="8"/>
  <text class="t" x="615" y="311">PostgreSQL</text>
</svg>
