name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Anbieterdaten stehen nicht im Repo: Kopie der Seite bauen und die Platzhalter aus den Organisations-Variablen einsetzen.
      # Fehlt ein Pflichtwert, bricht der Lauf ab (keine Seite mit Platzhaltern online).
      - name: Anbieterdaten einsetzen
        env:
          PROVIDER_NAME: ${{ vars.PROVIDER_NAME }}
          PROVIDER_STREET: ${{ vars.PROVIDER_STREET }}
          PROVIDER_CITY: ${{ vars.PROVIDER_CITY }}
          PROVIDER_EMAIL: ${{ vars.PROVIDER_EMAIL }}
          PROVIDER_PHONE: ${{ vars.PROVIDER_PHONE }}
          PROVIDER_VAT_ID: ${{ vars.PROVIDER_VAT_ID }}
        run: |
          mkdir _site
          tar --exclude=./_site --exclude=./.git --exclude=./.github --exclude=./scripts -cf - . | tar -xf - -C _site
          python3 scripts/render-provider.py _site/impressum.html _site/datenschutz.html
          if grep -rn '{{' _site/*.html; then echo "Platzhalter-Reste auf der Seite" >&2; exit 1; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
